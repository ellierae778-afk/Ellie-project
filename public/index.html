<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova — Chat with Ollama</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">NOVA</div>
      <div class="topbar-controls">
        <div class="voice-toggle-wrap">
          <label class="voice-toggle">
            <input type="checkbox" id="voice-toggle-input" />
            <span class="voice-toggle-slider"></span>
          </label>
          <span id="voice-status" class="voice-status">🔇 Voice off</span>
        </div>
        <a id="google-status" class="google-status" href="/auth/google" target="_blank" rel="noopener"></a>
        <label for="model-select" class="sr-only">Model</label>
        <select id="model-select">
          <option value="">Loading models…</option>
        </select>
      </div>
    </header>

    <main class="dashboard">
      <aside class="side side-left">
        <section class="widget widget-weather" id="weather-widget">
          <div class="clock" id="clock"></div>
          <div class="weather-body" id="weather-body">
            <span class="widget-empty">Checking the sky…</span>
          </div>
          <button class="location-edit" id="location-edit" type="button">Set location</button>
        </section>

        <section class="widget widget-schedule">
          <div class="widget-head">
            <h2>Today's Schedule</h2>
            <button class="refresh" id="schedule-refresh" type="button" aria-label="Refresh schedule">⟳</button>
          </div>
          <ul class="widget-list" id="schedule-list">
            <li class="widget-empty">Loading…</li>
          </ul>
        </section>
      </aside>

      <section class="stage">
        <div class="greeting" id="greeting"></div>

        <div class="orb-wrap">
          <div class="orb" id="orb">
            <canvas id="orb-canvas" aria-hidden="true"></canvas>
          </div>
          <div class="orb-waves" id="orb-waves" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="orb-label" id="orb-label">Say "hey nova" to start</div>
        </div>

        <div class="live-transcript" id="live-transcript"></div>

        <div id="chat-log" class="chat-log" aria-live="polite"></div>

        <form id="chat-form" class="chat-form">
          <textarea
            id="chat-input"
            placeholder="Message Nova…"
            rows="1"
            autofocus
          ></textarea>
          <button type="submit" id="send-btn">Send</button>
        </form>
        <p id="status-line" class="status-line"></p>
      </section>

      <aside class="side side-right">
        <section class="widget widget-emails">
          <div class="widget-head">
            <h2>Important Emails</h2>
            <button class="refresh" id="emails-refresh" type="button" aria-label="Refresh emails">⟳</button>
          </div>
          <ul class="widget-list" id="emails-list">
            <li class="widget-empty">Loading…</li>
          </ul>
        </section>

        <section class="widget widget-integrations">
          <div class="widget-head">
            <h2>Connected APIs</h2>
          </div>
          <div class="quick-grid" id="quick-grid">
            <div class="quick-tile" data-service="calendar" data-kind="google">
              <span class="quick-icon">📅</span>
              <span class="quick-label">Calendar</span>
              <span class="quick-dot"></span>
            </div>
            <div class="quick-tile" data-service="gmail" data-kind="google">
              <span class="quick-icon">✉️</span>
              <span class="quick-label">Gmail</span>
              <span class="quick-dot"></span>
            </div>
            <div class="quick-tile" data-service="drive" data-kind="google">
              <span class="quick-icon">🗂️</span>
              <span class="quick-label">Drive</span>
              <span class="quick-dot"></span>
            </div>
            <div class="quick-tile" data-service="sheets" data-kind="google">
              <span class="quick-icon">📊</span>
              <span class="quick-label">Sheets</span>
              <span class="quick-dot"></span>
            </div>
            <div class="quick-tile" data-service="weather" data-kind="weather">
              <span class="quick-icon">☁️</span>
              <span class="quick-label">Weather</span>
              <span class="quick-dot"></span>
            </div>
            <div class="quick-tile" data-service="voice" data-kind="voice">
              <span class="quick-icon">🔊</span>
              <span class="quick-label">Voice</span>
              <span class="quick-dot"></span>
            </div>
          </div>
        </section>
      </aside>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
